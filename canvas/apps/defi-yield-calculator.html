<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFi 收益计算器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #888;
            font-size: 1.1em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(123, 44, 191, 0.3);
        }

        .card h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(123, 44, 191, 0.4);
        }

        .results {
            margin-top: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .result-label {
            color: #888;
            font-size: 0.9em;
        }

        .result-value {
            font-size: 1.3em;
            font-weight: bold;
        }

        .result-value.positive {
            color: #00ff88;
        }

        .result-value.negative {
            color: #ff4757;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .chart-container h3 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #7b2cbf;
        }

        .pool-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .pool-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .pool-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.05);
        }

        .pool-card h4 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .pool-card .apy {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }

        .pool-card .tvl {
            color: #888;
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .update-time {
            color: #7b2cbf;
            font-weight: bold;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card, .chart-container {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DeFi 收益计算器</h1>
            <p>基于 Curve、Aave、Uniswap 等协议的收益预测</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📊 计算参数</h2>
                <div class="form-group">
                    <label>投资金额 (USDT)</label>
                    <input type="number" id="investmentAmount" value="10000" min="1" step="100">
                </div>
                <div class="form-group">
                    <label>投资期限（天）</label>
                    <input type="number" id="investmentDays" value="30" min="1" max="365">
                </div>
                <div class="form-group">
                    <label>选择 DeFi 协议</label>
                    <select id="protocol">
                        <option value="curve">Curve Finance</option>
                        <option value="aave">Aave</option>
                        <option value="uniswap">Uniswap V3</option>
                        <option value="compound">Compound</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>选择资产池</label>
                    <select id="pool">
                        <option value="3pool">3pool (USDT-USDC-DAI)</option>
                        <option value="btcpool">sBTC Pool</option>
                        <option value="ethpool">stETH Pool</option>
                    </select>
                </div>
                <button class="btn" onclick="calculateYield()">计算收益</button>

                <div class="results" id="results" style="display: none;">
                    <div class="result-item">
                        <span class="result-label">年化收益率 (APY)</span>
                        <span class="result-value positive" id="apy">0%</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">预期收益</span>
                        <span class="result-value positive" id="expectedYield">$0</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">手续费</span>
                        <span class="result-value negative" id="fees">$0</span>
                    </div>
                    <div pool="result-item">
                        <span class="result-label">净收益</span>
                        <span class="result-value positive" id="netYield">$0</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>💎 热门收益池</h2>
                <div class="pool-info">
                    <div class="pool-card">
                        <h4>Curve 3pool</h4>
                        <div class="apy">2.45%</div>
                        <div class="tvl">TVL: $1.2B</div>
                    </div>
                    <div class="pool-card">
                        <h4>Aave USDC</h4>
                        <div class="apy">3.87%</div>
                        <div class="tvl">TVL: $2.8B</div>
                    </div>
                    <div class="pool-card">
                        <h4>Uniswap USDC/ETH</h4>
                        <div class="apy">5.23%</div>
                        <div class="tvl">TVL: $890M</div>
                    </div>
                    <div class="pool-card">
                        <h4>Compound DAI</h4>
                        <div class="apy">4.12%</div>
                        <div class="tvl">TVL: $650M</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h3>📈 收益增长趋势</h3>
            <canvas id="yieldChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>🥧 收益构成分析</h3>
            <canvas id="compositionChart"></canvas>
        </div>

        <div class="footer">
            <p>数据来源：Curve、Aave、Uniswap、Compound 官方</p>
            <p>更新时间：<span class="update-time" id="updateTime"></span></p>
        </div>
    </div>

    <script>
        // DeFi 协议数据
        const protocolData = {
            curve: {
                name: 'Curve Finance',
                pools: {
                    '3pool': { apy: 2.45, fee: 0.04, tvl: 1200000000 },
                    'btcpool': { apy: 1.87, fee: 0.04, tvl: 450000000 },
                    'ethpool': { apy: 3.21, fee: 0.04, tvl: 680000000 }
                }
            },
            aave: {
                name: 'Aave',
                pools: {
                    'usdc': { apy: 3.87, fee: 0.09, tvl: 2800000000 },
                    'dai': { apy: 2.98, fee: 0.09, tvl: 1200000000 }
                }
            },
            uniswap: {
                name: 'Uniswap V3',
                pools: {
                    'usdc-eth': { apy: 5.23, fee: 0.3, tvl: 890000000 }
                }
            },
            compound: {
                name: 'Compound',
                pools: {
                    'dai': { apy: 4.12, fee: 0.08, tvl: 650000000 }
                }
            }
        };

        let yieldChart, compositionChart;

        // 计算收益
        function calculateYield() {
            const investment = parseFloat(document.getElementById('investmentAmount').value);
            const days = parseInt(document.getElementById('investmentDays').value);
            const protocol = document.getElementById('protocol').value;
            const pool = document.getElementById('pool').value;

            const poolData = protocolData[protocol].pools[pool];

            if (!poolData) {
                alert('请选择有效的池');
                return;
            }

            // 计算收益
            const annualYield = investment * (poolData.apy / 100);
            const dailyYield = annualYield / 365;
            const expectedYield = dailyYield * days;

            // 计算手续费
            const fees = investment * (poolData.fee / 100) * (days / 365);
            const netYield = expectedYield - fees;

            // 更新显示
            document.getElementById('apy').textContent = poolData.apy.toFixed(2) + '%';
            document.getElementById('expectedYield').textContent = '$' + expectedYield.toFixed(2);
            document.getElementById('fees').textContent = '-$' + fees.toFixed(2);
            document.getElementById('netYield').textContent = '+$' + netYield.toFixed(2);

            document.getElementById('results').style.display = 'block';

            // 更新图表
            updateCharts(investment, days, poolData.apy, netYield, fees);
        }

        // 更新图表
        function updateCharts(investment, days, apy, netYield, fees) {
            const labels = [];
            const cumulativeData = [];
            let cumulative = 0;
            const dailyYield = investment * (apy / 100) / 365;

            for (let i = 1; i <= days; i++) {
                labels.push(`第 ${i} 天`);
                cumulative += dailyYield;
                cumulativeData.push(cumulative.toFixed(2));
            }

            // 收益增长趋势
            if (yieldChart) {
                yieldChart.destroy();
            }

            const ctx = document.getElementById('yieldChart').getContext('2d');
            yieldChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '累计收益 ($)',
                        data: cumulativeData,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#888' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        },
                        y: {
                            ticks: { color: '#888' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        }
                    }
                }
            });

            // 收益构成
            if (compositionChart) {
                compositionChart.destroy();
            }

            const ctx2 = document.getElementById('compositionChart').getContext('2d');
            compositionChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['净收益', '手续费'],
                    datasets: [{
                        data: [netYield, fees],
                        backgroundColor: ['#00ff88', '#ff4757'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#fff' }
                        }
                    }
                }
            });
        }

        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent =
                now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            calculateYield();
            setInterval(updateTime, 1000);
            updateTime();
        });
    </script>
</body>
</html>
