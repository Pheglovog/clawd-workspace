<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习进度追踪器</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease forwards;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.8;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.5s;
        }

        .chart-card h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-card h3 .icon {
            font-size: 1.2em;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .topic-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease forwards;
        }

        .topic-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .topic-card:nth-child(1) { animation-delay: 0.6s; }
        .topic-card:nth-child(2) { animation-delay: 0.7s; }
        .topic-card:nth-child(3) { animation-delay: 0.8s; }
        .topic-card:nth-child(4) { animation-delay: 0.9s; }
        .topic-card:nth-child(5) { animation-delay: 1.0s; }

        .topic-card h4 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #ffd93d;
        }

        .topic-card .progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .topic-card .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border-radius: 10px;
            transition: width 1s ease;
        }

        .topic-card .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #ccc;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 学习进度追踪器</h1>
            <p>DeFi 区块链学习成果总览</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value">10+</div>
                <div class="stat-label">学习小时</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-value">300K+</div>
                <div class="stat-label">学习字数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value">5</div>
                <div class="stat-label">DeFi 协议</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔧</div>
                <div class="stat-value">26</div>
                <div class="stat-label">智能合约</div>
            </div>
        </div>

        <div class="grid">
            <div class="chart-card">
                <h3><span class="icon">📈</span>学习时长趋势</h3>
                <canvas id="hoursChart"></canvas>
            </div>

            <div class="chart-card">
                <h3><span class="icon">📊</span>字数增长趋势</h3>
                <canvas id="wordsChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h3><span class="icon">🎯</span>研究方向进展</h3>
            <canvas id="radarChart"></canvas>
        </div>

        <div class="topics-grid">
            <div class="topic-card">
                <h4>Aave</h4>
                <div class="progress">
                    <div class="progress-bar" style="width: 95%"></div>
                </div>
                <div class="stats">
                    <span>进度: 95%</span>
                    <span>文档: 33K 字</span>
                </div>
            </div>

            <div class="topic-card">
                <h4>Uniswap V2/V3</h4>
                <div class="progress">
                    <div class="progress-bar" style="width: 90%"></div>
                </div>
                <div class="stats">
                    <span>进度: 90%</span>
                    <span>文档: 33K 字</span>
                </div>
            </div>

            <div class="topic-card">
                <h4>Compound</h4>
                <div class="progress">
                    <div class="progress-bar" style="width: 85%"></div>
                </div>
                <div class="stats">
                    <span>进度: 85%</span>
                    <span>文档: 33K 字</span>
                </div>
            </div>

            <div class="topic-card">
                <h4>跨链桥</h4>
                <div class="progress">
                    <div class="progress-bar" style="width: 80%"></div>
                </div>
                <div class="stats">
                    <span>进度: 80%</span>
                    <span>文档: 31K 字</span>
                </div>
            </div>

            <div class="topic-card">
                <h4>Curve Finance</h4>
                <div class="progress">
                    <div class="progress-bar" style="width: 75%"></div>
                </div>
                <div class="stats">
                    <span>进度: 75%</span>
                    <span>文档: 29K 字</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>📅 最后更新：<span id="updateTime"></span></p>
            <p>💪 继续加油，主动进化！</p>
        </div>
    </div>

    <script>
        let hoursChart, wordsChart, radarChart;

        // 学习数据
        const learningData = {
            hours: [
                { date: '2月1日', hours: 2 },
                { date: '2月5日', hours: 4 },
                { date: '2月8日', hours: 6 },
                { date: '2月9日', hours: 8 },
                { date: '2月11日', hours: 10 }
            ],
            words: [
                { date: '2月1日', words: 50000 },
                { date: '2月5日', words: 120000 },
                { date: '2月8日', words: 200000 },
                { date: '2月9日', words: 260000 },
                { date: '2月11日', words: 300000 }
            ]
        };

        // 初始化图表
        function initCharts() {
            // 学习时长趋势
            const ctx1 = document.getElementById('hoursChart').getContext('2d');
            hoursChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: learningData.hours.map(d => d.date),
                    datasets: [{
                        label: '学习小时',
                        data: learningData.hours.map(d => d.hours),
                        backgroundColor: 'rgba(0, 212, 255, 0.6)',
                        borderColor: '#00d4ff',
                        borderWidth: 2,
                        borderRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: 'rgba(255,255,255,0.7)' },
                            grid: { display: false }
                        },
                        y: {
                            ticks: { color: 'rgba(255,255,255,0.7)' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                }
            });

            // 字数增长趋势
            const ctx2 = document.getElementById('wordsChart').getContext('2d');
            wordsChart = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: learningData.words.map(d => d.date),
                    datasets: [{
                        label: '累计字数',
                        data: learningData.words.map(d => d.words),
                        borderColor: '#7b2cbf',
                        backgroundColor: 'rgba(123, 44, 191, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: 'rgba(255,255,255,0.7)' },
                            grid: { display: false }
                        },
                        y: {
                            ticks: {
                                color: 'rgba(255,255,255,0.7)',
                                callback: function(value) {
                                    return value / 1000 + 'K';
                                }
                            },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                }
            });

            // 研究方向雷达图
            const ctx3 = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctx3, {
                type: 'radar',
                data: {
                    labels: ['Aave', 'Uniswap', 'Compound', '跨链桥', 'Curve', '智能合约'],
                    datasets: [{
                        label: '掌握程度',
                        data: [95, 90, 85, 80, 75, 70],
                        backgroundColor: 'rgba(0, 212, 255, 0.2)',
                        borderColor: '#00d4ff',
                        borderWidth: 2,
                        pointBackgroundColor: '#00d4ff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        r: {
                            ticks: { color: 'rgba(255,255,255,0.7)', backdropColor: 'transparent' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#fff', font: { size: 12 } }
                        }
                    }
                }
            });
        }

        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent =
                now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            updateTime();
        });
    </script>
</body>
</html>
